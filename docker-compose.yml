# docker-compose.yml
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  seed:
    image: busigbil/database:latest 
    depends_on: 
      db: 
        condition: service_healthy

  app:
    image: busigbil/app:latest
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/data
    environment: 
      DATABASE_HOST: db
    depends_on:
      seed:
        condition: service_completed_successfully

  locust:
    image: busigbil/locust:latest
    ports:
      - "8089:8089"
    volumes:
      - ./logs:/data
    environment:
      HOST_URL: http://app:5000
      DATABASE_HOST: db
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata: